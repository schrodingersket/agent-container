services:
  agent-container:
    image: schrodingersket/agent-container:${PI_VERSION:-v1.5.2}
    build:
      args:
        - CLAUDE_CODE_VERSION=${CLAUDE_CODE_VERSION:-v2.1.325}
        - CODEX_VERSION=${CODEX_VERSION:-v0.169.0}
        - NODE_VERSION=${NODE_VERSION:-24}
        - OPENCODE_VERSION=${OPENCODE_VERSION:-v2.3.0}
        - PI_VERSION=${PI_VERSION:-v1.5.2}
        - UV_VERSION=${UV_VERSION:-0.13.8}
      context: .
